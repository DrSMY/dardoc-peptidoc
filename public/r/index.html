<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F8F7F2">
<title>Request a refill</title>
<!--OG-->
<link rel="stylesheet" href="/theme.css?v=docare25">
<style>
  body { background: var(--bg); margin: 0; }
  .rp { max-width: 560px; margin: 0 auto; padding: 0 16px; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  .rp-top { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: calc(14px + env(safe-area-inset-top)) 0 14px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
  .rp-logo { height: 34px; width: auto; max-width: 170px; object-fit: contain; display: block; }
  .rp-clinic { font: 700 16px/1.2 var(--font-head); color: var(--text); }
  .rp-private { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .rp-private svg { color: var(--sage); }
  .rp-title { margin: 0 0 8px; font: 500 30px/1.15 var(--font-display); color: var(--brand); letter-spacing: -.01em; }
  .rp-sub { margin: 0 0 20px; font-size: 15px; line-height: 1.55; color: var(--muted); }
  .rp-med { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 16px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }
  .rp-med-ico { width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0; display: grid; place-items: center;
    color: var(--mc, var(--brand)); background: color-mix(in srgb, var(--mc, var(--brand)) 12%, #fff); }
  .rp-med-name { font: 700 15.5px/1.3 var(--font-head); color: var(--text); }
  .rp-med-dose { font-size: 13.5px; color: var(--muted); }
  .rp-switch { margin-left: auto; flex-shrink: 0; min-height: 44px; padding: 0 4px; background: none; border: 0;
    font-size: 13.5px; font-weight: 600; color: var(--brand); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  /* each question is its own card on the page */
  .rp-form .rr-sec { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px 16px; margin-bottom: 12px; }
  .rp-form .rr-sec:first-child { padding-top: 18px; }
  .rp-form .rr-sec:last-child { border-bottom: 1px solid var(--border); }
  .rp-cta { position: sticky; bottom: 0; margin: 4px -16px 0; padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 72%, rgba(248,247,242,0)); }
  .rp-cta .btn { min-height: 52px; font-size: 16px; }
  .rp-cta p { margin: 8px 0 0; text-align: center; font-size: 12.5px; color: var(--muted); }
  /* medication picker */
  .rp-plans { display: flex; flex-direction: column; gap: 10px; }
  .rp-plan { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 14px; text-align: left;
    background: var(--surface); border: 1.5px solid var(--border-strong); border-radius: 16px; cursor: pointer;
    font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; transition: border-color .15s ease, box-shadow .15s ease; }
  .rp-plan:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .rp-plan:active { box-shadow: 0 0 0 3px var(--brand-soft); border-color: var(--brand); }
  @media (hover: hover) { .rp-plan:hover { border-color: var(--brand); } }
  .rp-plan-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .rp-plan > svg:last-child { color: var(--muted); flex-shrink: 0; }
  .rp-pending { display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; font-size: 12px; font-weight: 600; color: var(--sage); }
  /* states */
  .rp-state { margin-top: 8px; text-align: center; padding: 40px 22px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }
  .rp-state-ico { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); }
  .rp-state h1 { margin: 0 0 6px; font: 700 20px/1.3 var(--font-head); color: var(--text); }
  .rp-state p { margin: 0 auto; max-width: 340px; font-size: 14.5px; line-height: 1.55; color: var(--muted); }
  .rp-state p + p { margin-top: 10px; font-size: 13px; }
  .rp-skel { border-radius: 16px; margin-bottom: 12px; }
  @media (min-width: 600px) { .rp-title { font-size: 34px; } }
</style>
</head>
<body>
<main class="rp" id="rp">
  <div class="skel rp-skel" style="height:56px;margin-top:16px"></div>
  <div class="skel rp-skel" style="height:90px"></div>
  <div class="skel rp-skel" style="height:260px"></div>
</main>
<script src="/shared.js?v=docare68"></script>
<script src="/guide.js?v=docare68"></script>
<script src="/r/app.js?v=docare68"></script>
</body>
</html>
