<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#283618">
<title>Request a refill</title>
<!--OG-->
<link rel="stylesheet" href="/theme.css?v=docare25">
<style>
  body { background: var(--bg); margin: 0; }
  .rp { max-width: 560px; margin: 0 auto; padding: 16px 14px calc(44px + env(safe-area-inset-bottom)); }
  .rp-skel { height: 90px; border-radius: var(--r-lg); margin-bottom: 14px; }
  .rp-skel + .rp-skel { height: 280px; }
  .rp-intro { font-size: 14.5px; color: var(--muted); line-height: 1.5; margin: 0 0 16px; }
  .rp-plancards { display: flex; flex-direction: column; gap: 10px; }
  .rp-plancard { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
    padding: 14px 16px; cursor: pointer; min-height: 44px; transition: border-color .15s ease, box-shadow .15s ease; }
  .rp-plancard:hover { border-color: var(--mc, var(--brand)); box-shadow: var(--shadow-sm); }
  .rp-plancard:active { transform: scale(.99); }
  .rp-plancard-ico { width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    color: var(--mc, var(--brand)); background: color-mix(in srgb, var(--mc, var(--brand)) 13%, #fff); }
  .rp-plancard-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .rp-plancard-name { font-family: var(--font-head); font-weight: 700; font-size: 15px; }
  .rp-plancard-dose { font-size: 12.5px; color: var(--muted); }
  .rp-plancard svg:last-child { color: var(--faint); flex-shrink: 0; }
  .rp-back { display: inline-flex; align-items: center; gap: 5px; margin-bottom: 12px; }
  .rp-card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .rp-card-med { font-family: var(--font-head); font-weight: 700; font-size: 16.5px; }
  .rp-card-dose { font-size: 13px; color: var(--muted); }
  .rp-state { text-align: center; padding: 48px 22px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); }
  .rp-state h1 { font-size: 19px; margin: 12px 0 6px; }
  .rp-state p { color: var(--muted); font-size: 14px; max-width: 360px; margin: 0 auto; line-height: 1.55; }
  .rp-state svg { color: var(--brand); }
  @media (max-width: 420px) { .rp { padding: 10px 8px calc(36px + env(safe-area-inset-bottom)); } }
</style>
</head>
<body>
<main class="rp" id="rp">
  <div class="skel rp-skel"></div>
  <div class="skel rp-skel"></div>
</main>
<script src="/shared.js?v=docare64"></script>
<script src="/guide.js?v=docare64"></script>
<script src="/r/app.js?v=docare64"></script>
</body>
</html>
