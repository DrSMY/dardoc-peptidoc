<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Portal — DoCare</title>
<link rel="stylesheet" href="/theme.css?v=docare25">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23283618'/><path d='M72 32 A27 27 0 1 0 72 68' fill='none' stroke='%23C6A15B' stroke-width='7' stroke-linecap='round'/><rect x='66' y='23' width='15' height='11' rx='4' fill='%23C6A15B'/><circle cx='41' cy='60' r='13' fill='none' stroke='%23C6A15B' stroke-width='4.5'/><circle cx='41' cy='60' r='6' fill='%23C6A15B'/></svg>">
<style>
  body { background: var(--bg); }
  .p-app { max-width: 560px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; }
  .p-top { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center;
    padding: 14px 16px 10px;
    background: var(--brand); color: #fff; }
  .p-top .t-logo-btn { justify-self: center; background: none; border: none; padding: 4px; cursor: pointer; border-radius: 10px; }
  .p-top .t-logo-btn:active { transform: scale(.95); }
  .p-top .t-logo-btn:focus-visible { outline: 2.5px solid var(--champagne-gold, #E1C784); outline-offset: 2px; }
  .p-top .t-logo { display: block; height: 34px; width: auto;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,.5)) drop-shadow(0 0 12px rgba(225,199,132,.28)); }
  .p-top .icon-btn { color: #fff; }
  .p-top .icon-btn:hover { background: rgba(255,255,255,.12); }

  /* dark olive band behind the home greeting + hero card */
  .home-band { margin: -18px -16px 0; padding: 8px 20px 84px; background: var(--brand); border-radius: 0 0 26px 26px; }
  .home-band.no-plan { padding-bottom: 26px; }
  .hello-dark { display: flex; align-items: center; gap: 13px; color: #fff; margin: 8px 0 20px; }
  .avatar-circ { width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
    background: rgba(255,255,255,.14); display: flex; align-items: center; justify-content: center;
    font-family: var(--font-head); font-weight: 700; font-size: 16px; letter-spacing: .02em; }
  .hello-dark h1 { font-size: 21px; color: #fff; }
  .hello-dark .sub { font-size: 13px; color: rgba(255,255,255,.68); margin-top: 1px; }

  /* hero card — medication status on the dark band */
  .hero-card { position: relative; background: var(--surface); border-radius: 20px; padding: 18px 18px 16px; box-shadow: var(--shadow-md); }
  .hero-lbl { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--brand); padding-right: 116px; }
  .hero-title { font-family: var(--font-display); font-size: 30px; font-weight: 400; line-height: 1.1; letter-spacing: -.01em; margin: 4px 0 6px; color: var(--text); }
  .hero-desc { font-size: 13.5px; color: var(--muted); line-height: 1.5; max-width: 62%; }
  .hero-photo { position: absolute; top: 12px; right: 8px; width: 118px; height: 122px; object-fit: contain; pointer-events: none; }
  /* interactive phase journey — colored dots on a filling track */
  .phase-journey { position: relative; display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding: 6px 0; }
  .pj-track { position: absolute; left: 17px; right: 17px; top: 50%; height: 4px;
    transform: translateY(-50%); background: var(--bg); border-radius: 2px; overflow: hidden; }
  .pj-track > span { display: block; height: 100%; width: 100%; border-radius: 2px; background: var(--brand);
    transform-origin: left; transform: scaleX(var(--fill, 0)); transition: transform .6s var(--ease); }
  .phase-day { position: relative; z-index: 1; width: 34px; height: 34px; border-radius: 50%; border: none; padding: 0;
    font-family: var(--font-head); font-weight: 700; font-size: 12.5px;
    color: var(--pc); background: var(--surface);
    box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--pc) 45%, #fff);
    cursor: pointer;
    transition: transform .16s var(--ease), box-shadow .16s var(--ease), background .16s var(--ease), color .16s var(--ease); }
  .phase-day::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; }
  .phase-day.done { background: var(--pc); color: #fff; box-shadow: none; }
  .phase-day.now { background: var(--pc); color: #fff; transform: scale(1.16);
    box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--pc);
    animation: pjPulse 2.4s var(--ease) infinite; }
  .phase-day.sel { transform: scale(1.12); box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--refined-gold, #C6A15B); }
  .phase-day:active { transform: scale(.9); }
  .phase-day.mini { width: 22px; height: 22px; }
  @keyframes pjPulse {
    0%, 100% { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--pc); }
    50% { box-shadow: 0 0 0 3px var(--surface), 0 0 0 9px color-mix(in srgb, var(--pc) 40%, transparent); }
  }
  /* medication photos gently float in place */
  .hero-photo, .dose-photo { animation: medFloat 3.8s ease-in-out infinite; }
  @keyframes medFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero-photo, .dose-photo, .phase-day.now, .pj-track > span { animation: none; transition: none; }
  }
  .hero-meta { display: flex; justify-content: space-between; margin-top: 10px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .hero-next { margin-top: 6px; font-size: 12.5px; color: var(--muted); }
  .qa-grid.qa-overlap { margin-top: -64px; position: relative; z-index: 1; }

  /* "Your dose & how to take it" card */
  .dose-card { position: relative; }
  .dose-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .dose-head b { font-family: var(--font-head); font-size: 15.5px; }
  .dose-head .qa-ico { width: 38px; height: 38px; }
  .dose-chips { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .chip-solid, .chip-soft { border-radius: var(--r-full); padding: 5px 14px; font-weight: 700; font-size: 13px; font-family: var(--font-head); }
  .chip-solid { background: var(--brand); color: #fff; }
  .chip-soft { background: var(--brand-soft); color: var(--brand); }
  .dose-text { font-size: 13.5px; color: var(--muted); line-height: 1.5; max-width: 62%; margin-bottom: 10px; }
  .dose-photo { position: absolute; top: 14px; right: 10px; width: 100px; height: 124px; object-fit: contain; pointer-events: none; }
  .linklike-p { background: none; border: none; color: var(--brand); font-weight: 700; font-family: var(--font-head); font-size: 13.5px; display: inline-flex; align-items: center; gap: 5px; padding: 0; }

  .p-view { flex: 1; padding: 18px 16px calc(86px + env(safe-area-inset-bottom)); }

  /* staggered tab-content entrance (JS sets per-child delay in animateView) */
  @keyframes pv-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .p-nav button { transition: color .2s var(--ease); }
  .p-nav button svg { transition: transform .2s var(--ease); }
  .p-nav button.on svg { transform: translateY(-2px) scale(1.06); }
  @media (prefers-reduced-motion: reduce) {
    .p-view > * { animation: none !important; }
    .p-nav button svg, .p-nav button.on svg { transition: none; transform: none; }
  }

  .p-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: min(560px, 100%); z-index: 100;
    display: flex; background: var(--surface);
    border-top: 1px solid var(--border); box-shadow: 0 -4px 20px rgba(20,49,47,.07);
    padding-bottom: env(safe-area-inset-bottom); }
  .p-nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 10px 4px 9px; background: none; border: none; color: var(--faint);
    font-size: 10.5px; font-weight: 700; font-family: var(--font-head); letter-spacing: .02em;
    min-height: 56px; }
  .p-nav button.on { color: var(--brand); }
  .p-nav .nav-log { margin-top: -22px; }
  .p-nav .nav-log .log-fab { width: 52px; height: 52px; border-radius: 50%;
    background: var(--brand); color: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px rgba(30,76,78,.4);
    transition: transform .15s var(--ease); }
  .p-nav .nav-log:active .log-fab { transform: scale(.93); }

  /* per-medication row on the home screen's "Your medications" list */
  .med-row { border-top: 1px solid var(--border); }
  .med-row:first-child { border-top: none; }
  .med-row-sum { display: flex; align-items: center; gap: 12px; padding: 13px 16px; cursor: pointer; list-style: none; }
  .med-row-sum::-webkit-details-marker { display: none; }
  .med-row-sum svg:last-child { color: var(--muted); transition: transform .2s var(--ease); flex-shrink: 0; }
  .med-row[open] .med-row-sum svg:last-child { transform: rotate(90deg); }
  .med-row-sum:hover { background: var(--brand-soft); }
  .med-row-illus { flex-shrink: 0; line-height: 0; }
  .med-row-sum .pt-info { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .med-row-body { padding: 0 16px 16px 68px; }
  .med-row-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .qa-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .qa { display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
    padding: 16px; text-align: left;
    transition: transform .13s var(--ease), border-color .15s var(--ease); }
  .qa:active { transform: scale(.97); }
  .qa-ico { width: 46px; height: 46px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: flex; align-items: center; justify-content: center; }
  .qa b { font-family: var(--font-head); font-size: 15px; }
  .qa span { font-size: 12.5px; color: var(--muted); }

  .list-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); margin-bottom: 16px; }
  .list-head { display: flex; align-items: center; justify-content: space-between; padding: 15px 16px 0; }
  .list-head h3 { font-size: 15px; display: flex; gap: 8px; align-items: center; }
  .list-head h3 svg { color: var(--brand); }

  .site-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

  .msg-list { display: flex; flex-direction: column; gap: 10px; padding: 4px 2px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 14.5px; }
  .msg.patient { align-self: flex-end; background: var(--brand); color: #fff; border-bottom-right-radius: 4px; }
  .msg.doctor { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg-time { font-size: 10.5px; opacity: .65; margin-top: 3px; }
  .msg-bar { position: fixed; bottom: calc(64px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: min(560px, 100%); padding: 10px 14px; background: var(--bg); display: flex; gap: 8px; }

  .sym-block { margin-bottom: 14px; }
  .sym-lbl { font-size: 12.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 7px; }
  .sym-opts { display: flex; gap: 7px; flex-wrap: wrap; }

  /* patient welcome animation overlay (plays with sound after login,
     or when the header logo is tapped) */
  .login-anim { position: fixed; inset: 0; z-index: 500;
    background:
      radial-gradient(60% 50% at 18% 12%, rgba(198, 161, 91, .16), transparent 60%),
      radial-gradient(55% 45% at 85% 88%, rgba(113, 131, 85, .20), transparent 65%),
      linear-gradient(160deg, #283618, #1C2412 70%);
    opacity: 1; transition: opacity .45s var(--ease); }
  .login-anim.closing { opacity: 0; pointer-events: none; }
  .login-anim video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  @media (min-width: 768px) { .login-anim video { object-fit: contain; } }
  .la-skip { position: absolute; z-index: 2; left: 50%; transform: translateX(-50%);
    bottom: calc(26px + env(safe-area-inset-bottom));
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 24px; min-height: 46px; border: 1px solid rgba(225, 199, 132, .35); border-radius: 999px;
    background: rgba(23, 32, 15, .4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    color: #F5F0DF; font-family: var(--font-head); font-weight: 700; font-size: 14px; cursor: pointer; }
  .la-skip:active { transform: translateX(-50%) scale(.95); }
  .la-endcard { position: absolute; inset: 0; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: linear-gradient(160deg, #283618, #1C2412 75%);
    opacity: 0; pointer-events: none; transition: opacity .6s var(--ease); }
  .login-anim.ending .la-endcard { opacity: 1; }
  .la-endcard img { width: min(320px, 70vw); height: auto; filter: drop-shadow(0 4px 12px rgba(0,0,0,.55)) drop-shadow(0 0 22px rgba(225,199,132,.32)); }
  .la-endcard span { font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: var(--champagne-gold, #E1C784); font-weight: 700; }

  /* ══ Log page: distinct modes + colour-coded medications ═══════════ */
  .p-app { --ci: #2E5AAC; }   /* daily check-in accent (distinct from meds) */

  /* big segmented mode switch — injection (olive) vs check-in (blue) */
  /* compact page heading on the Log tab so the form itself leads */
  .log-hello { margin-bottom: 12px; }
  .log-hello h1 { font-size: 24px; }
  .log-hello .sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; }

  .mode-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .mode-btn { display: flex; align-items: center; gap: 9px; text-align: left;
    padding: 10px 11px; border-radius: 14px; border: 1.5px solid var(--border);
    background: var(--surface); color: var(--muted); box-shadow: var(--shadow-sm);
    transition: transform .14s var(--ease), box-shadow .18s var(--ease), border-color .18s var(--ease), background .18s var(--ease); }
  .mode-btn:active { transform: scale(.98); }
  .mode-btn .mode-ico { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--faint); transition: background .18s var(--ease), color .18s var(--ease); }
  .mode-btn .mode-tx { display: flex; flex-direction: column; min-width: 0; }
  .mode-btn .mode-tx b { font-family: var(--font-head); font-size: 13.5px; color: var(--text); line-height: 1.15; white-space: nowrap; }
  .mode-btn .mode-tx small { font-size: 10.5px; color: var(--faint); margin-top: 1px; white-space: nowrap; }
  .mode-btn.inj.on { border-color: var(--brand); background: var(--brand); }
  .mode-btn.ci.on { border-color: var(--ci); background: var(--ci); }
  .mode-btn.on .mode-ico { background: rgba(255,255,255,.18); color: #fff; }
  .mode-btn.on .mode-tx b { color: #fff; }
  .mode-btn.on .mode-tx small { color: rgba(255,255,255,.82); }

  /* Medication form icons: body at low opacity, details solid, both in the
     medication's own colour — the silhouette says which medicine it is. */

  /* colour-coded medication selector */
  .med-select { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 12px; margin-bottom: 14px; }
  .med-select-lbl { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 2px 4px 9px; }
  .med-opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    padding: 11px 12px; border-radius: 14px; border: 1.5px solid transparent; background: var(--bg);
    margin-bottom: 8px; transition: border-color .15s var(--ease), background .15s var(--ease), transform .12s var(--ease); }
  .med-opt:last-child { margin-bottom: 0; }
  .med-opt:active { transform: scale(.985); }
  .med-opt-ico { width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--mc); background: color-mix(in srgb, var(--mc) 13%, #fff); }
  .med-opt-tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .med-opt-tx b { font-family: var(--font-head); font-size: 14.5px; color: var(--text); }
  .med-opt-badges { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .med-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; font-family: var(--font-head); padding: 2px 9px; border-radius: 999px; background: color-mix(in srgb, var(--mc, var(--brand)) 15%, #fff); color: color-mix(in srgb, var(--mc, var(--brand)) 72%, #000); }
  .med-opt-check { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; background: var(--mc); opacity: 0; transform: scale(.6); transition: opacity .15s var(--ease), transform .15s var(--ease); }
  .med-opt.sel { border-color: var(--mc); background: color-mix(in srgb, var(--mc) 8%, #fff); }
  .med-opt.sel .med-opt-check { opacity: 1; transform: scale(1); }

  /* the inline logging panel, tinted with the selected medication's colour */
  .log-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 16px 16px 18px; margin-bottom: 14px; }
  .log-panel-head, .ci-head { display: flex; align-items: center; gap: 11px; margin-bottom: 15px; }
  .lp-ico, .ci-ico { width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .lp-ico { background: color-mix(in srgb, var(--mc) 13%, #fff); color: var(--mc); }
  .ci-ico { background: color-mix(in srgb, var(--ci) 13%, #fff); color: var(--ci); }
  .lp-title { display: flex; flex-direction: column; min-width: 0; }
  .lp-title b { font-family: var(--font-head); font-size: 15px; color: var(--text); }
  .lp-title small { font-size: 12px; color: var(--muted); }
  .lp-save { background: var(--mc); color: #fff; }
  .lp-save:hover { filter: brightness(1.04); }
  .lp-save .btn-label, .ci-save .btn-label { display: inline-flex; align-items: center; gap: 8px; }

  /* clickable injection-site body map (medical illustrations) */
  .bodymap { display: flex; align-items: center; justify-content: center; gap: 1%; width: 100%; margin: 2px 0 8px; overflow: hidden; }
  .bm-fig { position: relative; line-height: 0; }
  .bm-fig img { width: 100%; height: auto; display: block; -webkit-user-drag: none; user-select: none; }
  /* zones are real buttons overlaid on the drawing, placed by percentage */
  /* The illustration already draws each zone (dashed outline + number), so
     the buttons stay invisible until touched — they are hit areas, and the
     chosen one lights up in the medication's colour. */
  .hs { position: absolute; left: var(--l); top: var(--t); width: var(--w); height: var(--h);
    transform: translate(-50%, -50%); padding: 0;
    border: 2.5px solid transparent; border-radius: 16%/22%;
    background: transparent;
    transition: background .16s var(--ease), border-color .16s var(--ease), box-shadow .16s var(--ease), transform .14s var(--ease); }
  .hs.round { border-radius: 50%; }
  /* widen the tap area past the zone outline without moving it */
  .hs::after { content: ""; position: absolute; inset: -8px; border-radius: inherit; }
  .hs:hover { background: color-mix(in srgb, var(--mc) 14%, transparent); }
  .hs:active { transform: translate(-50%, -50%) scale(.94); }
  .hs:focus-visible { outline: 3px solid var(--mc); outline-offset: 3px; }
  .hs.on { border-color: var(--mc);
    background: color-mix(in srgb, var(--mc) 30%, transparent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--mc) 24%, transparent); }
  .site-pick { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .site-pick.chosen { color: var(--mc); font-weight: 600; }
  .site-pick b { font-family: var(--font-head); }
  @media (prefers-reduced-motion: reduce) { .hs { transition: none; } }

  /* Guide medication chooser — every medication visible, nothing scrolled off */
  .g-medbar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 12px; margin: 14px 0 12px; }
  .g-medbar-head { display: flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 2px 2px 10px; }
  .g-medbar-head svg { color: var(--brand); }
  /* wins over guide.js's .g-picker rules, which are injected into <head>
     after this stylesheet and would otherwise set the row/wrap layout */
  .g-medlist.g-medlist { display: flex; flex-direction: column; flex-wrap: nowrap; gap: 8px; margin: 0; }
  .g-medcard { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
    padding: 10px 11px; border-radius: 13px; border: 1.5px solid transparent; background: var(--bg);
    transition: border-color .15s var(--ease), background .15s var(--ease), transform .12s var(--ease); }
  .g-medcard:active { transform: scale(.985); }
  .g-medcard-ico { width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--mc); background: color-mix(in srgb, var(--mc) 13%, #fff); }
  .g-medcard-tx { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .g-medcard-tx b { font-family: var(--font-head); font-size: 14px; color: var(--text); line-height: 1.2; }
  .g-medcard-tx small { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .g-medcard-badge { flex-shrink: 0; font-size: 10.5px; font-weight: 700; font-family: var(--font-head); padding: 3px 9px; border-radius: 999px; background: color-mix(in srgb, var(--mc) 15%, #fff); color: color-mix(in srgb, var(--mc) 72%, #000); }
